<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FlyTripVisa AI">
<meta name="theme-color" content="#1677ff">
<meta name="format-detection" content="telephone=no">
<title>Fly AI - FlyTripVisa</title>
<!-- FontAwesome for file icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --primary:#1677ff; --primary-light:#4096ff; --orange:#ff6b35; --orange-light:#ff8c42;
  --bg:#f0f2f5; --card:#ffffff; --text:#1a1a1a; --muted:#8a8f98; --border:rgba(0,0,0,.07);
  --console:#eaf2ff; --shadow:0 1px 4px rgba(0,0,0,.06);
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#000; --card:#121212; --text:#ececec; --muted:#7d838c; --border:#232323; --console:#141414; --shadow:none}
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{height:100%;height:100dvh;background:var(--bg);color:var(--text)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Bengali",Helvetica,Arial,sans-serif;
  line-height:1.5;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;
}
button{font:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}

.app-header{
  flex:none;display:flex;align-items:center;justify-content:center;gap:8px;
  height:calc(44px + var(--safe-top));padding:var(--safe-top) 12px 0;
  background:linear-gradient(135deg,var(--primary),var(--primary-light));
  box-shadow:0 2px 8px rgba(22,119,255,.2);
}
.app-header h1{font-size:17px;font-weight:600;letter-spacing:.3px;color:#fff}
.live{width:8px;height:8px;border-radius:50%;background:#52c41a;box-shadow:0 0 0 3px rgba(82,196,26,.25)}

/* ids and classes in this block are the ones the template's chat.js relies on */
.chat-messages{
  flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:14px 14px 6px;display:flex;flex-direction:column;gap:10px;
}
.message{max-width:86%;padding:10px 14px;border-radius:16px;box-shadow:var(--shadow)}
.message p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.message:has(> p:empty){display:none}
.user-message{align-self:flex-end;color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary-light));border-bottom-right-radius:4px}
.assistant-message{align-self:flex-start;background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px}

/* ---- Attachments inside messages ---- */
.attachment-preview{margin-bottom:8px}
.attachment-preview img{
  max-width:100%;max-height:180px;border-radius:10px;display:block;object-fit:cover;
  border:1px solid rgba(255,255,255,.15);
}
.file-chip{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);
  padding:8px 10px;border-radius:10px;max-width:100%;
}
.file-chip .file-icon{
  width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;font-size:13px;
  background:rgba(255,255,255,.2);color:#fff;
}
.file-chip .file-icon.pdf{background:rgba(239,68,68,.3);color:#ffe4e4}
.file-chip .file-icon.doc{background:rgba(59,130,246,.3);color:#dbeafe}
.file-chip .file-icon.img{background:rgba(52,211,153,.3);color:#d1fae5}
.file-chip .file-meta{display:flex;flex-direction:column;min-width:0}
.file-chip .file-name{font-weight:600;color:#fff;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
.file-chip .file-size{font-size:10px;color:rgba(255,255,255,.75)}
.attachment-caption{font-size:11px;color:rgba(255,255,255,.85);margin-top:4px}

/* typing indicator - always reserves height */
.typing-indicator{
  flex:none;height:24px;padding:0 20px;display:flex;align-items:center;gap:5px;
  visibility:hidden;font-size:0;
}
.typing-indicator.visible{visibility:visible}
.typing-indicator i{width:6px;height:6px;border-radius:50%;background:var(--primary);animation:dot 1.1s infinite}
.typing-indicator i:nth-child(2){animation-delay:.15s}
.typing-indicator i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25}40%{opacity:1}}

.message-input{
  flex:none;padding:6px 10px calc(8px + var(--safe-bottom));
  background:var(--card);border-top:1px solid var(--border);
}
.console-bar{
  display:flex;align-items:flex-end;gap:6px;min-height:46px;padding:5px 5px 5px 8px;
  background:var(--console);border:1.5px solid rgba(22,119,255,.14);border-radius:24px;transition:border-color .2s;
  max-width:900px;margin:0 auto;width:100%;
}
.console-bar:focus-within{border-color:rgba(22,119,255,.45)}
#user-input{
  flex:1;min-width:0;max-height:120px;padding:7px 0;border:0;outline:0;background:transparent;
  color:var(--text);font:inherit;font-size:16px;line-height:1.4;resize:none;
}
#user-input::placeholder{color:var(--muted)}
#user-input:disabled{opacity:1;color:var(--text);-webkit-text-fill-color:var(--text);background:transparent}
.circle{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-size:15px;transition:transform .15s}
.circle:active{transform:scale(.92)}
#attach-button{background:var(--card);color:var(--primary);border:1px solid var(--border)}
#attach-button:hover{background:var(--console)}
#voice-button{background:linear-gradient(135deg,var(--primary),var(--primary-light));box-shadow:0 2px 8px rgba(22,119,255,.3)}
#voice-button.listening{background:linear-gradient(135deg,#ff4d4f,#ff7875);animation:ring 1.2s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,77,79,.45)}70%{box-shadow:0 0 0 10px rgba(255,77,79,0)}100%{box-shadow:0 0 0 0 rgba(255,77,79,0)}}
#send-button{background:linear-gradient(135deg,var(--orange),var(--orange-light));box-shadow:0 2px 8px rgba(255,107,53,.3)}
#send-button:disabled{opacity:.45;cursor:not-allowed}
#attach-button:focus-visible,#voice-button:focus-visible,#send-button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

@media (min-width:600px){
  .chat-messages{max-width:900px;width:100%;margin:0 auto}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
#real-file-input{display:none}
</style>
</head>
<body>

<!-- HEADER -->
<header class="app-header">
  <span class="live" aria-hidden="true"></span>
  <h1>Fly AI - FlyTripVisa</h1>
</header>

<!-- CHAT FEED -->
<div id="chat-messages" class="chat-messages" aria-live="polite">
  <div class="message assistant-message">
    <p>Hello! I'm an Fly AI Powered by flytripvisa.site.</p>
    <p>👽 Fly AI - How can I help you today? You can also send me images or PDF documents.</p>
  </div>
</div>

<!-- TYPING INDICATOR -->
<div class="typing-indicator" id="typing-indicator" aria-label="Fly AI is thinking"><i></i><i></i><i></i>Fly AI is thinking...</div>

<!-- INPUT BAR -->
<div class="message-input">
  <div class="console-bar">
    <input type="file" id="real-file-input" accept="image/*,application/pdf,.doc,.docx" multiple>
    <button class="circle" id="attach-button" type="button" aria-label="Attach file" title="Attach image or document">
      <i class="fa-solid fa-paperclip" style="font-size:14px;"></i>
    </button>
    <textarea id="user-input" rows="1" placeholder="Ask anything..." aria-label="Message" autocomplete="off"></textarea>
    <button class="circle" id="voice-button" type="button" aria-label="Voice input">🎤</button>
    <button class="circle" id="send-button" type="button" aria-label="Send message">➤</button>
  </div>
</div>

<!-- Chat app script (the template's own file - handles real AI responses over WebSocket) -->
<script src="chat.js"></script>

<!-- UI extras + attachments + voice dictation + keyboard viewport -->
<script>
(function () {
  // IMPORTANT: chat.js owns the real AI connection.
  // We only attach UI extras here. Make sure chat.js binds to:
  //   #user-input, #send-button, #typing-indicator, #chat-messages
  // and appends messages with class "user-message" / "assistant-message".

  var input     = document.getElementById('user-input');
  var sendBtn   = document.getElementById('send-button');
  var voiceBtn  = document.getElementById('voice-button');
  var attachBtn = document.getElementById('attach-button');
  var fileInput = document.getElementById('real-file-input');
  var feed      = document.getElementById('chat-messages');
  var typing    = document.getElementById('typing-indicator');

  // ---------- utilities ----------
  function escapeHtml(t){
    var m={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'};
    return String(t).replace(/[&<>"']/g,function(c){return m[c];});
  }
  function formatFileSize(b){
    if(!b) return '0 B';
    var u=['B','KB','MB','GB'],i=0,s=b;
    while(s>=1024&&i<u.length-1){s/=1024;i++;}
    return s.toFixed(s>=10||i===0?0:1)+' '+u[i];
  }
  function fileIconClass(f){
    if(f.type.startsWith('image/')) return 'img';
    if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)) return 'pdf';
    return 'doc';
  }
  function fileIconFA(f){
    if(f.type.startsWith('image/')) return 'fa-image';
    if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)) return 'fa-file-pdf';
    return 'fa-file-word';
  }
  function scrollToBottom(){ feed.scrollTop = feed.scrollHeight; }

  // ---------- message renderers ----------
  function appendTextMessage(text, sender){
    var div = document.createElement('div');
    div.className = 'message ' + (sender==='user' ? 'user-message' : 'assistant-message');
    var p = document.createElement('p');
    p.textContent = text;
    div.appendChild(p);
    feed.appendChild(div);
    scrollToBottom();
  }

  function appendFileMessage(file){
    var div = document.createElement('div');
    div.className = 'message user-message';

    var preview = document.createElement('div');
    preview.className = 'attachment-preview';

    if (file.type.startsWith('image/')) {
      var img = document.createElement('img');
      img.alt = file.name;
      var r = new FileReader();
      r.onload = function(e){ img.src = e.target.result; };
      r.readAsDataURL(file);
      preview.appendChild(img);
    } else {
      var chip = document.createElement('div');
      chip.className = 'file-chip';
      chip.innerHTML =
        '<div class="file-icon '+fileIconClass(file)+'"><i class="fa-solid '+fileIconFA(file)+'"></i></div>'+
        '<div class="file-meta">'+
          '<span class="file-name">'+escapeHtml(file.name)+'</span>'+
          '<span class="file-size">'+formatFileSize(file.size)+'</span>'+
        '</div>';
      preview.appendChild(chip);
    }

    var cap = document.createElement('p');
    cap.className = 'attachment-caption';
    cap.textContent = '📎 ' + file.name;

    div.appendChild(preview);
    div.appendChild(cap);
    feed.appendChild(div);
    scrollToBottom();
  }

  // ---------- text send (fallback only if chat.js isn't wired to #send-button) ----------
  // We dispatch a synthetic event so chat.js can hook in if it wants.
  function sendText(){
    var text = input.value.trim();
    if(!text) return;

    // If chat.js already handles the click/enter, it will pick this up.
    // Otherwise we render locally so the UI never feels broken.
    var evt = new CustomEvent('fly:send', {detail:{text:text}, cancelable:true});
    var handled = !input.dispatchEvent(evt);

    if(!handled){
      appendTextMessage(text, 'user');
      typing.classList.add('visible');
      // If chat.js doesn't reply, show a graceful fallback message after 1.2s
      setTimeout(function(){
        typing.classList.remove('visible');
        if(!feed.querySelector('.assistant-message:last-child') ||
           feed.lastElementChild.classList.contains('user-message')){
          appendTextMessage('⚠️ AI connection not detected. Please verify chat.js is loaded and the Worker is running.', 'bot');
        }
      }, 1200);
    }

    input.value = '';
    input.style.height = 'auto';
    input.focus();
  }

  input.addEventListener('input', function(){
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });
  input.addEventListener('keydown', function(e){
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendText(); }
  });
  sendBtn.addEventListener('click', sendText);

  // ---------- attachments ----------
  attachBtn.addEventListener('click', function(){ fileInput.click(); });

  fileInput.addEventListener('change', function(ev){
    var files = ev.target.files;
    if(!files || !files.length) return;
    for(var i=0;i<files.length;i++) appendFileMessage(files[i]);

    // Let chat.js (if present) know files were attached
    var names = [];
    for(var j=0;j<files.length;j++) names.push(files[j].name);
    window.dispatchEvent(new CustomEvent('fly:attach', {detail:{files:files}}));

    typing.classList.add('visible');
    setTimeout(function(){
      typing.classList.remove('visible');
      if(feed.lastElementChild.classList.contains('user-message')){
        appendTextMessage(
          files.length===1
            ? '✅ Received "'+names[0]+'". Processing your file now...'
            : '✅ Received '+files.length+' files. Processing them now...',
          'bot'
        );
      }
    }, 900);

    ev.target.value = '';
  });

  // ---------- voice ----------
  var rec=null, on=false;
  voiceBtn.addEventListener('click', function(){
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ alert('Voice input is not supported in this browser.'); return; }
    if(on){ rec.stop(); return; }
    rec = new SR();
    rec.lang = navigator.language || 'en-US';
    rec.interimResults = false;
    rec.continuous = false;
    rec.onstart  = function(){ on=true; voiceBtn.classList.add('listening'); };
    rec.onresult = function(e){
      input.value = (input.value + ' ' + e.results[0][0].transcript).trim();
      input.dispatchEvent(new Event('input'));
    };
    rec.onend = rec.onerror = function(){ on=false; voiceBtn.classList.remove('listening'); };
    rec.start();
  });

  // ---------- keyboard viewport ----------
  if (window.visualViewport) {
    var vv = window.visualViewport;
    function fit(){
      document.body.style.height = vv.height + 'px';
      window.scrollTo(0,0);
      scrollToBottom();
    }
    vv.addEventListener('resize', fit);
    vv.addEventListener('scroll', function(){ window.scrollTo(0,0); });
    fit();
  }

  // ---------- drag & drop ----------
  ['dragover','drop'].forEach(function(evt){
    feed.addEventListener(evt, function(e){
      e.preventDefault();
      if(evt==='drop' && e.dataTransfer && e.dataTransfer.files.length){
        var dropped = e.dataTransfer.files;
        for(var i=0;i<dropped.length;i++) appendFileMessage(dropped[i]);
        window.dispatchEvent(new CustomEvent('fly:attach', {detail:{files:dropped}}));
        typing.classList.add('visible');
        setTimeout(function(){
          typing.classList.remove('visible');
          appendTextMessage('✅ Received '+dropped.length+' file(s) via drop. Processing...', 'bot');
        }, 900);
      }
    });
  });
})();
</script>
</body>
</html>
