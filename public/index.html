<!DOCTYPE html>
<html lang="en" class="h-full w-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>FlyTripVisa - Real-Time Mobile Chat Studio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: #000000;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            color: #e2e8f0;
        }

        #app-body {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* --- HEADER --- */
        .app-header {
            height: 2.5rem;
            min-height: 2.5rem;
            max-height: 2.5rem;
            background: #000;
            border-bottom: 1px solid rgba(39, 39, 42, 0.8);
            padding: 0 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-shrink: 0;
            z-index: 50;
        }
        .app-header .live {
            width: 0.5rem;
            height: 0.5rem;
            border-radius: 9999px;
            background: #34d399;
            box-shadow: 0 0 0 2px rgba(52, 211, 153, 0.2);
            animation: pulse-live 1.8s infinite;
            flex-shrink: 0;
        }
        @keyframes pulse-live {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 2px rgba(52, 211, 153, 0.2); }
            50% { opacity: 0.6; box-shadow: 0 0 0 4px rgba(52, 211, 153, 0.05); }
        }
        .app-header h1 {
            font-size: 0.8125rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: #fff;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- Chat feed --- */
        .chat-messages {
            flex: 1 1 auto;
            overflow-y: auto;
            padding: 0.5rem 0.65rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            background: #000;
            scroll-behavior: smooth;
        }
        .message {
            max-width: 90%;
            padding: 0.55rem 0.7rem;
            border-radius: 0.75rem;
            font-size: 0.75rem;
            line-height: 1.4;
            word-wrap: break-word;
            animation: fade-in 0.2s ease-out;
        }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .assistant-message {
            align-self: flex-start;
            background: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #cbd5e1;
            border-top-left-radius: 0.25rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .assistant-message p { margin: 0 0 0.35rem; }
        .assistant-message p:last-child { margin-bottom: 0; }

        .user-message {
            align-self: flex-end;
            background: #0284c7;
            color: #fff;
            border-top-right-radius: 0.25rem;
            box-shadow: 0 2px 6px rgba(2, 132, 199, 0.25);
        }
        .user-message p { margin: 0; }

        /* --- Attachment previews inside messages --- */
        .attachment-preview {
            margin-bottom: 0.4rem;
        }
        .attachment-preview img {
            max-width: 100%;
            max-height: 160px;
            border-radius: 0.5rem;
            display: block;
            object-fit: cover;
        }
        .file-chip {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(24, 24, 27, 0.85);
            border: 1px solid rgba(63, 63, 70, 0.6);
            padding: 0.4rem 0.55rem;
            border-radius: 0.5rem;
            font-size: 0.6875rem;
            color: #e0f2fe;
            max-width: 100%;
        }
        .file-chip .file-icon {
            width: 1.5rem;
            height: 1.5rem;
            border-radius: 0.375rem;
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 0.75rem;
        }
        .file-chip .file-icon.pdf { background: rgba(239, 68, 68, 0.15); color: #f87171; }
        .file-chip .file-icon.doc { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
        .file-chip .file-icon.img { background: rgba(52, 211, 153, 0.15); color: #34d399; }
        .file-chip .file-meta {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .file-chip .file-name {
            font-weight: 500;
            color: #fff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 170px;
        }
        .file-chip .file-size {
            font-size: 0.5625rem;
            color: #a1a1aa;
        }

        /* --- Typing indicator --- */
        .typing-indicator {
            display: none;
            padding: 0.4rem 0.75rem;
            font-size: 0.6875rem;
            color: #94a3b8;
            align-items: center;
            gap: 0.2rem;
            background: #000;
            flex-shrink: 0;
        }
        .typing-indicator.visible { display: flex; }
        .typing-indicator i {
            width: 0.3rem;
            height: 0.3rem;
            border-radius: 9999px;
            background: #38bdf8;
            display: inline-block;
            animation: typing-bounce 1.2s infinite ease-in-out;
        }
        .typing-indicator i:nth-child(2) { animation-delay: 0.15s; }
        .typing-indicator i:nth-child(3) { animation-delay: 0.3s; margin-right: 0.35rem; }
        @keyframes typing-bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-3px); opacity: 1; }
        }

        /* --- Input bar --- */
        .message-input {
            flex-shrink: 0;
            background: #000;
            border-top: 1px solid rgba(39, 39, 42, 0.8);
            padding: 0.3rem 0.5rem;
        }
        .console-bar {
            display: flex;
            align-items: flex-end;
            gap: 0.35rem;
            max-width: 64rem;
            margin: 0 auto;
            width: 100%;
        }
        .console-bar textarea {
            flex: 1 1 auto;
            resize: none;
            max-height: 120px;
            min-height: 2rem;
            padding: 0.4rem 0.75rem;
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 9999px;
            color: #fff;
            font-family: inherit;
            font-size: 0.75rem;
            line-height: 1.35;
            outline: none;
            transition: border-color 0.15s;
        }
        .console-bar textarea::placeholder { color: #52525b; }
        .console-bar textarea:focus { border-color: #0ea5e9; }

        .circle {
            width: 2rem;
            height: 2rem;
            min-width: 2rem;
            border-radius: 9999px;
            border: 1px solid #27272a;
            background: #18181b;
            color: #a1a1aa;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.15s;
            flex-shrink: 0;
            padding: 0;
        }
        .circle:hover { color: #fff; border-color: #3f3f46; }
        #attach-button:hover { color: #38bdf8; border-color: #0ea5e9; }
        #send-button {
            background: #0ea5e9;
            border-color: #0ea5e9;
            color: #fff;
            box-shadow: 0 2px 8px rgba(14, 165, 233, 0.25);
        }
        #send-button:hover { background: #38bdf8; }

        .circle.listening {
            animation: pulse-red 1.5s infinite;
            background-color: rgba(239, 68, 68, 0.2) !important;
            border-color: rgba(239, 68, 68, 0.5) !important;
            color: #ef4444 !important;
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0.0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.0); }
        }

        /* --- Footer --- */
        .app-footer {
            flex-shrink: 0;
            background: #000;
            border-top: 1px solid rgba(9, 9, 11, 0.9);
            padding: 0.2rem 0.75rem;
            text-align: center;
            font-size: 0.5625rem;
            color: #71717a;
            line-height: 1.2;
        }

        /* Hidden file input */
        #real-file-input { display: none; }
    </style>
</head>
<body id="app-body">

    <!-- HEADER -->
    <header class="app-header">
        <span class="live" aria-hidden="true"></span>
        <h1>Fly AI - FlyTripVisa</h1>
    </header>

    <!-- CHAT FEED -->
    <div id="chat-messages" class="chat-messages" aria-live="polite">
        <div class="message assistant-message">
            <p>Hello! I'm an Fly AI Powered by flytripvisa.site.</p>
            <p>👽 Fly AI - How can I help you today? You can send me images or PDF documents too.</p>
        </div>
    </div>

    <!-- TYPING INDICATOR -->
    <div class="typing-indicator" id="typing-indicator" aria-label="Fly AI is thinking"><i></i><i></i><i></i>Fly AI is thinking...</div>

    <!-- INPUT BAR -->
    <div class="message-input">
        <div class="console-bar">
            <input type="file" id="real-file-input" accept="image/*,application/pdf,.doc,.docx" multiple>
            <button class="circle" id="attach-button" type="button" aria-label="Attach file" title="Attach image or document">📎</button>
            <textarea id="user-input" rows="1" placeholder="Ask anything..." aria-label="Message" autocomplete="off"></textarea>
            <button class="circle" id="voice-button" type="button" aria-label="Voice input">🎤</button>
            <button class="circle" id="send-button" type="button" aria-label="Send message">➤</button>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="app-footer">
        FlyTripVisa Studio • Real-Time Cloudflare Ready
    </footer>

    <!-- Chat logic + Attachments -->
    <script>
        (function () {
            var input = document.getElementById('user-input');
            var sendBtn = document.getElementById('send-button');
            var voiceBtn = document.getElementById('voice-button');
            var attachBtn = document.getElementById('attach-button');
            var fileInput = document.getElementById('real-file-input');
            var feed = document.getElementById('chat-messages');
            var typing = document.getElementById('typing-indicator');
            var body = document.getElementById('app-body');

            // ---------- Utilities ----------
            function escapeHtml(text) {
                var map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
                return String(text).replace(/[&<>"']/g, function (m) { return map[m]; });
            }

            function formatFileSize(bytes) {
                if (!bytes) return '0 B';
                var units = ['B', 'KB', 'MB', 'GB'];
                var i = 0, size = bytes;
                while (size >= 1024 && i < units.length - 1) { size /= 1024; i++; }
                return size.toFixed(size >= 10 || i === 0 ? 0 : 1) + ' ' + units[i];
            }

            function fileIconClass(file) {
                if (file.type.startsWith('image/')) return 'img';
                if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) return 'pdf';
                return 'doc';
            }

            function fileIconFA(file) {
                if (file.type.startsWith('image/')) return 'fa-image';
                if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) return 'fa-file-pdf';
                return 'fa-file-word';
            }

            function scrollToBottom() {
                feed.scrollTop = feed.scrollHeight;
            }

            // ---------- Append messages ----------
            function appendTextMessage(text, sender) {
                var div = document.createElement('div');
                div.className = 'message ' + (sender === 'user' ? 'user-message' : 'assistant-message');
                var p = document.createElement('p');
                p.textContent = text;
                div.appendChild(p);
                feed.appendChild(div);
                scrollToBottom();
            }

            function appendFileMessage(file) {
                var div = document.createElement('div');
                div.className = 'message user-message';

                var preview = document.createElement('div');
                preview.className = 'attachment-preview';

                if (file.type.startsWith('image/')) {
                    var img = document.createElement('img');
                    img.alt = file.name;
                    var reader = new FileReader();
                    reader.onload = function (e) { img.src = e.target.result; };
                    reader.readAsDataURL(file);
                    preview.appendChild(img);
                } else {
                    var chip = document.createElement('div');
                    chip.className = 'file-chip';
                    chip.innerHTML =
                        '<div class="file-icon ' + fileIconClass(file) + '"><i class="fa-solid ' + fileIconFA(file) + '"></i></div>' +
                        '<div class="file-meta">' +
                            '<span class="file-name">' + escapeHtml(file.name) + '</span>' +
                            '<span class="file-size">' + formatFileSize(file.size) + '</span>' +
                        '</div>';
                    preview.appendChild(chip);
                }

                var caption = document.createElement('p');
                caption.textContent = '📎 ' + file.name;
                caption.style.fontSize = '0.6875rem';
                caption.style.opacity = '0.85';

                div.appendChild(preview);
                div.appendChild(caption);
                feed.appendChild(div);
                scrollToBottom();
            }

            // Simulated bot reply
            function botReply(text) {
                typing.classList.add('visible');
                scrollToBottom();
                setTimeout(function () {
                    typing.classList.remove('visible');
                    appendTextMessage(text, 'bot');
                }, 900);
            }

            // ---------- Send text ----------
            function sendMessage() {
                var text = input.value.trim();
                if (!text) return;
                appendTextMessage(text, 'user');
                input.value = '';
                input.style.height = 'auto';
                input.focus();
                botReply('Message processed via cloud channel successfully!');
            }

            input.addEventListener('input', function () {
                input.style.height = 'auto';
                input.style.height = Math.min(input.scrollHeight, 120) + 'px';
            });

            input.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            sendBtn.addEventListener('click', sendMessage);

            // ---------- Attachment ----------
            attachBtn.addEventListener('click', function () {
                fileInput.click();
            });

            fileInput.addEventListener('change', function (event) {
                var files = event.target.files;
                if (!files || !files.length) return;

                var count = files.length;
                for (var i = 0; i < count; i++) {
                    appendFileMessage(files[i]);
                }

                // Bot confirmation
                var names = [];
                for (var j = 0; j < count; j++) names.push(files[j].name);
                botReply(
                    count === 1
                        ? '✅ Received "' + names[0] + '". Processing your file now...'
                        : '✅ Received ' + count + ' files. Processing them now...'
                );

                // Reset so same file can be re-selected
                event.target.value = '';
            });

            // ---------- Voice dictation ----------
            var rec = null, on = false;
            voiceBtn.addEventListener('click', function () {
                var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) { alert('Voice input is not supported in this browser.'); return; }
                if (on) { rec.stop(); return; }
                rec = new SR();
                rec.lang = navigator.language || 'en-US';
                rec.interimResults = false;
                rec.continuous = false;
                rec.onstart = function () { on = true; voiceBtn.classList.add('listening'); };
                rec.onresult = function (e) {
                    input.value = (input.value + ' ' + e.results[0][0].transcript).trim();
                    input.dispatchEvent(new Event('input'));
                };
                rec.onend = rec.onerror = function () { on = false; voiceBtn.classList.remove('listening'); };
                rec.start();
            });

            // ---------- Keyboard-aware viewport ----------
            if (window.visualViewport) {
                var vv = window.visualViewport;
                function updateViewportSize() {
                    body.style.height = vv.height + 'px';
                    window.scrollTo(0, 0);
                    scrollToBottom();
                }
                vv.addEventListener('resize', updateViewportSize);
                vv.addEventListener('scroll', function () { window.scrollTo(0, 0); });
                updateViewportSize();
            }

            // Drag & drop support on the chat feed (bonus)
            ['dragover', 'drop'].forEach(function (evt) {
                feed.addEventListener(evt, function (e) {
                    e.preventDefault();
                    if (evt === 'drop' && e.dataTransfer && e.dataTransfer.files.length) {
                        var droppedFiles = e.dataTransfer.files;
                        for (var i = 0; i < droppedFiles.length; i++) {
                            appendFileMessage(droppedFiles[i]);
                        }
                        botReply('✅ Received ' + droppedFiles.length + ' file(s) via drop. Processing...');
                    }
                });
            });
        })();
    </script>
</body>
</html>
